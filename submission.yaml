submission:
  title: "GridHealth AI"

  problem_statement: >
    Power transformer and substation failures cause blackouts costing utilities
    $1 M+/hour and affecting millions of people. Most utilities still rely on
    calendar-based maintenance while sensors already measuring temperature,
    vibration, partial discharge, and oil quality show failure signatures weeks
    in advance. Weather events compound the risk, but sensor data and weather
    forecasts are never combined in time to act.

  solution_summary: >
    GridHealth AI is a full-stack predictive monitoring platform that fuses
    30-day transformer/substation sensor telemetry, live OpenWeatherMap weather
    forecasts, and three years of historical incident data into real-time
    risk-ranked predictions via an XGBoost model. It surfaces outage-prone
    assets on a live Leaflet map, explains predictions with SHAP values, and
    auto-generates a prioritised, crew-assigned maintenance plan — all
    accessible through a React dashboard backed by a FastAPI REST API.

  key_features:
    - "XGBoost failure prediction model scoring 0-100 risk per asset from 30-day sensor trends"
    - "Priority-weighted risk ranking: 50% model score + 25% customers served + critical-facility and weather bonuses"
    - "SHAP explainability — per-asset feature contribution breakdown on the Asset Detail page"
    - "Live weather integration: real OpenWeatherMap 5-day forecasts classified into typed alert events"
    - "Auto-generated maintenance plan with emergency/urgent/routine tiers and round-robin crew assignment"
    - "Interactive Leaflet grid map with colour-coded risk markers across 5 geographic zones"
    - "Four fully consistent UI themes: Dark, Light, High Contrast Dark, High Contrast Light"

  tech_stack:
    languages: ["Python", "TypeScript", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS", "SQLAlchemy", "Pydantic"]
    ibm_technologies: ["IBM Bob"]
    databases: ["SQLite"]
    other: ["XGBoost", "SHAP", "scikit-learn", "OpenWeatherMap API", "Leaflet", "Recharts", "Zustand", "TanStack Table", "GitHub Actions"]

  what_we_are_most_proud_of: >
    The complete integrated pipeline — synthetic sensor data with real
    transformer-failure physics feeds an XGBoost model, whose SHAP-explained
    predictions flow through a FastAPI backend into a React dashboard, all
    sharing a single SQLite database and runnable from scratch in under
    5 minutes. The live weather overlay that pulls real OpenWeatherMap forecasts,
    classifies them into typed alert events, and automatically adjusts per-asset
    priority scores is the standout feature that makes the system genuinely
    useful beyond a demo.

  known_limitations: >
    The XGBoost model trains on synthetic rule-based labels (no real SCADA
    outage ground truth) — in production these would be replaced by actual
    historical outage labels. The live weather endpoint requires a free
    OpenWeatherMap API key. Authentication is not implemented. The Asset Detail
    sensor trend charts currently display mock data; the real
    /api/v1/assets/{id}/sensors endpoint exists and is ready but the frontend
    wiring is the next step.

