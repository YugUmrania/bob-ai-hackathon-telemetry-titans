submission:
  title: "GridHealth AI"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    "Power transformer and substation failures cause blackouts costing utilities $1M+/hour and affecting millions of people. Most utilities still use calendar-based maintenance, while sensors already measuring temperature, vibration, partial discharge, and oil quality show failure signatures weeks in advance. Weather events compound the risk — but sensor data and weather forecasts are never combined in time to act."

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    "GridHealth AI combines transformer/substation sensor health data, weather forecasts, and historical incident records into risk-ranked predictions. It surfaces outage-prone assets on a live map, ranks equipment by grid-impact severity, and generates a prioritized maintenance and crew pre-positioning plan."

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Failure prediction model (XGBoost) scoring asset failure probability from sensor trends"
    - "Risk-ranking formula weighing sensor alarms, weather exposure, and customers served"
    - "Interactive grid map with risk-colored asset markers (Leaflet)"
    - "Prioritized maintenance and crew pre-positioning plan generator"
    - "Asset detail view with sensor trend charts and SHAP explanation"

  tech_stack:
    languages: ["Python", "Typescript", "Javascript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["React", "FastAPI", "SHAP", "XGBoost"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["OpenWhetherMap API", "Nova", "Github Actions", "Git"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

